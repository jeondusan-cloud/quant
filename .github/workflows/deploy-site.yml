# site/ 폴더를 GitHub Pages로 배포한다.
# 저장소가 비공개인 동안에는 배포 작업을 건너뛴다 (무료 플랜의 Pages는 공개 저장소에서만 동작).
# 켜는 방법: docs/00-start-here.md 의 "처음 한 번 설정"
name: 사이트 배포

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
